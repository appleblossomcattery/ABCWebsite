# Apple Blossom Cattery — Netlify configuration
# Static site + one serverless function for the enquiry form.
# Set RESEND_API_KEY under Site settings → Environment variables.
#
# The build runs prerender.js, which:
#   - injects the crawler-facing <head> (seo-head.html) into the bundle,
#   - renders every route (routes.js) to its own real URL in dist/ with a
#     distinct <title>/description/canonical and crawlable content,
#   - emits sitemap.xml + _redirects and copies robots.txt.
# Source files are never mutated, so it is safe to re-run. The design tool
# owns index.html — re-export it and rebuild; never hand-edit it.

[build]
  publish = "dist"
  # Install Chromium explicitly before pre-rendering. Puppeteer's post-install
  # download only runs when npm actually installs the package; once Netlify
  # restores node_modules from its build cache, that step is skipped and the
  # Chromium binary (kept in .cache/puppeteer, which Netlify does not cache) is
  # missing. Running the browser install in the build command guarantees it is
  # present on every build; it is idempotent (a no-op once downloaded).
  command = "npx puppeteer browsers install chrome && node prerender.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cache policy. Netlify's default (max-age=0, must-revalidate) forces a
# revalidation round-trip on every asset on every visit. NOTE the content
# under /images/ and /documents/ changes at STABLE URLs by design (gallery
# photos and the policies PDF are replaced keeping the same filename), so
# these are bounded lifetimes with stale-while-revalidate — NOT immutable.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# The app bundle assets are content-hashed filenames (see prerender.js
# externalisation) — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
