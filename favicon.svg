<!-- Apple Blossom Cattery — the site's logo mark, as a favicon.
     Lifted verbatim from the blossom the design bundle draws beside the
     wordmark in the site header (same circles, same fills, same #FBEEF4
     ground), cropped to the mark's bounding box so it fills a 16px tab slot.
     Published as real files because the bundle's own tab icon is a data: URI,
     which Google cannot fetch for a search result — which is why a generic
     globe replaced the blossom in the listing.
     favicon.ico / apple-touch-icon.png / icon-512.png render these same
     coordinates; keep all four in step. -->
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 184 184' role='img' aria-label='Apple Blossom Cattery'>
  <rect width='184' height='184' rx='30' fill='#FBEEF4'/>
  <g transform='translate(92,96.5)'>
    <circle cx='0' cy='-48' r='35' fill='#E89BC0'/>
    <circle cx='46' cy='-15' r='35' fill='#CE6D9E'/>
    <circle cx='28' cy='39' r='35' fill='#C58AB0'/>
    <circle cx='-28' cy='39' r='35' fill='#E89BC0'/>
    <circle cx='-46' cy='-15' r='35' fill='#F3C4DA'/>
    <circle cx='0' cy='-4' r='21' fill='#9B4880'/>
  </g>
</svg>
