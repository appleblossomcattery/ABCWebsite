<!-- Apple Blossom Cattery — the site's own favicon artwork.
     Taken from the icon the design bundle injects as a data: URI on hydration,
     republished as a real file because Google cannot fetch a data: URI — which
     is exactly why the blossom vanished from the search listing and a generic
     globe took its place. Keep this in step with the bundle's own icon.
     favicon.ico / apple-touch-icon.png / icon-512.png are rendered from these
     same coordinates. -->
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' role='img' aria-label='Apple Blossom Cattery'>
  <rect width='100' height='100' rx='24' fill='#9B4880'/>
  <g fill='#FCEAF2'>
    <ellipse cx='50' cy='29' rx='14.5' ry='21'/>
    <ellipse cx='50' cy='29' rx='14.5' ry='21' transform='rotate(72 50 50)'/>
    <ellipse cx='50' cy='29' rx='14.5' ry='21' transform='rotate(144 50 50)'/>
    <ellipse cx='50' cy='29' rx='14.5' ry='21' transform='rotate(216 50 50)'/>
    <ellipse cx='50' cy='29' rx='14.5' ry='21' transform='rotate(288 50 50)'/>
  </g>
  <circle cx='50' cy='50' r='8.5' fill='#F2B84B'/>
</svg>
